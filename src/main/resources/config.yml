# ═════════════════ Ocean API Configuration ═════════════════
anticheat:
  # Your Ocean API Key (Enterprise owner only)
  api-key: "YOUR_API_KEY_HERE"

  # Game type for scans (Java, Bedrock, FiveM, RedM, RageMP, AltV, Roblox, SanAndreas, Cod, Rust)
  game-type: "Java"

  # Enable RUIN dump analysis
  RUIN: true

  # Make pins private (only visible to you)
  private-pins: false

  # Base URL for scan results (do not change unless you know what you're doing)
  results-base-url: "https://anticheat.ac/results/pin/"

  # Server name sent as x-server-name header for usage logging (optional)
  server-name: ""

# ═════════════════ AI Assistant Configuration ═════════════════
# Fully configurable! Use any AI provider with an API key:
# - AgentRouter (unified AI gateway / agentic router: https://agentrouter.org or https://agentrouter.to)
# - OpenRouter (supports hundreds of models: Claude, GPT, DeepSeek, Llama, Qwen, etc.)
# - OpenAI (ChatGPT, GPT-4o, GPT-4o-mini)
# - xAI / Grok (grok-beta, grok-2)
# - Groq (ultra fast: llama-3.3-70b, mixtral)
# - Google Gemini (via OpenAI-compatible endpoint or OpenRouter)
# - Anthropic Claude (via AgentRouter, OpenRouter, or proxy)
# - Ollama / LocalAI (run completely local/free on your server)
ai:
  # Enable or disable AI assistant features (/ocean ai and /ocean ask)
  enabled: true

  # ─────────────────────────────────────────────────────────────
  # Step 1: Put your AI API key here!
  # ─────────────────────────────────────────────────────────────
  # Examples:
  # - AgentRouter: "aak_xxxxxxxx..."     (Get one at https://agentrouter.org or https://agentrouter.to)
  # - OpenRouter:  "sk-or-v1-xxxxxxxx..." (Get one at https://openrouter.ai/keys)
  # - OpenAI:      "sk-proj-xxxxxxxx..." (Get one at https://platform.openai.com/api-keys)
  # - Groq:        "gsk_xxxxxxxx..."     (Free/fast at https://console.groq.com/keys)
  # - xAI (Grok):  "xai-xxxxxxxx..."     (Get one at https://console.x.ai)
  # - Ollama:      "ollama"              (No key needed for local Ollama)
  api-key: "YOUR_AI_API_KEY_HERE"

  # ─────────────────────────────────────────────────────────────
  # Step 2: Choose your chat completions endpoint URL
  # ─────────────────────────────────────────────────────────────
  # Popular endpoint presets:
  # - AgentRouter: "https://agentrouter.org/v1/chat/completions" (or "https://api.agentrouter.to/v1/chat/completions")
  # - OpenRouter:  "https://openrouter.ai/api/v1/chat/completions"
  # - OpenAI:      "https://api.openai.com/v1/chat/completions"
  # - Groq:        "https://api.groq.com/openai/v1/chat/completions"
  # - xAI (Grok):  "https://api.x.ai/v1/chat/completions"
  # - Ollama:      "http://localhost:11434/v1/chat/completions"
  # - LocalAI:     "http://localhost:8080/v1/chat/completions"
  endpoint: "https://agentrouter.org/v1/chat/completions"

  # ─────────────────────────────────────────────────────────────
  # Step 3: Choose your model ID
  # ─────────────────────────────────────────────────────────────
  # Popular model examples:
  # • AgentRouter:
  #   - "claude-3-5-sonnet-20241022"
  #   - "claude-3-5-haiku-20241022"
  #   - "gpt-4o-mini"
  #   - "gpt-4o"
  #   - "deepseek-chat"
  # • OpenRouter:
  #   - "openai/gpt-4o-mini"               (Fast, cheap, very smart)
  #   - "anthropic/claude-3.5-haiku"       (Fast, sharp reasoning)
  #   - "deepseek/deepseek-chat"           (Extremely cost effective)
  #   - "meta-llama/llama-3.3-70b-instruct"(Open weights powerhouse)
  #   - "x-ai/grok-2"                      (Grok 2 via OpenRouter)
  # • OpenAI directly:
  #   - "gpt-4o-mini"
  #   - "gpt-4o"
  # • Groq directly:
  #   - "llama-3.3-70b-versatile"
  # • xAI directly:
  #   - "grok-beta"
  # • Local Ollama:
  #   - "llama3.2" or "mistral"
  model: "claude-3-5-haiku-20241022"

  # ─────────────────────────────────────────────────────────────
  # Step 4: Fine-tune behavior & prompts
  # ─────────────────────────────────────────────────────────────
  # Creativity (0.0 = strict & deterministic, 1.0 = creative)
  temperature: 0.3

  # Maximum tokens in response (1 token ≈ 4 characters, 600 ≈ 3-5 chat messages)
  max-tokens: 600

  # Automatically have AI analyze every screenshare scan when it finishes
  # and broadcast a verdict + ban advice to online staff members
  auto-analyze-scans: true

  # Custom system prompt explaining the AI's persona and instructions
  system-prompt: "You are Ocean AI, an expert screenshare forensic security assistant for Minecraft server staff. Provide concise, authoritative advice formatted cleanly for Minecraft chat (use bullet points, no markdown headers #). Analyze forensic results, cheats, injection traces, and Discord/HWID links. Be decisive when recommending bans or unbans."

  # OpenRouter optional ranking metadata
  site-url: "https://anticheat.ac"
  site-name: "Ocean Freeze AntiCheat"

  # ─────────────────────────────────────────────────────────────
  # Step 5: Advanced & AgentRouter Client Spoofing (Fixes 401 Unauthorized Client)
  # ─────────────────────────────────────────────────────────────
  # AgentRouter protects its endpoints with an anti-bot WAF that blocks generic clients.
  # When set to true (or when endpoint contains 'agentrouter'), the plugin automatically
  # injects approved client fingerprint headers (Claude Code CLI / Stainless / x-app).
  agentrouter-mode: true

  # Custom User-Agent header (leave empty or default for automatic detection)
  custom-user-agent: "claude-cli/0.2.29 (external, cli)"

  # Optional arbitrary custom headers to send with AI requests
  # custom-headers:
  #   x-custom-header: "value"

# ════════════════════ Plugin Settings ════════════════════
settings:
  # Broadcast freeze actions to all staff members
  broadcast-to-staff: true

  # Auto-ban players who disconnect while frozen
  auto-ban-on-quit: false

  # Ban command template (use %player% for player name)
  # Examples: "ban %player% SS Evasion" | "tempban %player% 7d Left during SS"
  ban-command: "ban %player% Disconnected during screenshare"

  # Freeze mode: AUTO or MANUAL
  # AUTO: Automatically creates scan PIN when freezing
  # MANUAL: Only freezes player, use /ocean scan <player> to start scan
  freeze-mode: "MANUAL"

  # Freeze Response GUI
  # When enabled, frozen players see a GUI with "Admit" and "Proceed" buttons
  freeze-gui-enabled: true

  # Reapply the freeze when a frozen player rejoins the server
  Automatic-Freeze: true

  # Command executed when a player admits to hacking (use %player% for player name)
  freeze-gui-admit-command: "ban %player% Admitted to using hacks"

  # Repeat freeze message interval (in seconds)
  # The freeze warning will repeat at this interval
  # Set to 0 to disable repetition
  freeze-message-interval: 30

  # Repeat scan instructions interval (in seconds)
  # Scan instructions will repeat until scan starts
  # Set to 0 to disable repetition
  scan-message-interval: 30

  # Scan monitoring interval (in seconds)
  # How often the plugin checks the scan status from the API
  scan-check-interval: 5

  # Scan monitoring timeout (in minutes)
  # Maximum time to monitor a scan before giving up
  scan-timeout: 30

  # Potion effects applied to frozen players
  freeze-effects:
    enabled: true
    effects:
      - type: BLINDNESS
        amplifier: 0
      - type: SLOW_DIGGING
        amplifier: 255
      # Available effects: BLINDNESS, SLOW_DIGGING (mining fatigue), SLOWNESS,
      # WEAKNESS, NIGHT_VISION, DARKNESS (1.17+), etc.
      # amplifier: 0 = level 1, 1 = level 2, 255 = max level

  # Commands that frozen players can use (without /)
  allowed-commands:
    - "msg"
    - "message"
    - "tell"
    - "whisper"
    - "w"
    - "reply"
    - "r"

  # Commands that frozen players CANNOT use (without /)
  # These commands will be blocked even if in allowed-commands
  blacklist-commands: true
  blacklist-message: "&cThis command is blacklisted you cannot use it while frozen!"
  blacklist:
    - "plugman"
    - "pl"

# ══════════════════ Discord Webhook Configuration ══════════════════
discord:
  # Discord webhook URL (set to "none" to disable)
  webhook-url: "none"

  # Bot display name in Discord
  bot-name: "Ocean Freeze 🧊"

  # Bot avatar URL (leave empty for default)
  bot-avatar: ""

  # Enable/disable specific webhook logs
  log-freeze: true
  log-scan-results: true

  # ═══ Freeze Notification ═══
  freeze-embed-title: "🧊 Player Frozen"
  freeze-embed-description: "**{player}** has been frozen by **{staff}**"
  freeze-embed-color: 3447003  # Blue (decimal color)

  freeze-field-player-name: "👤 Player"
  freeze-field-player-value: "{player}"
  freeze-field-staff-name: "👮 Staff"
  freeze-field-staff-value: "{staff}"
  freeze-field-pin-name: "🔑 Scan PIN"
  freeze-field-pin-value: "`{pin}`"

  freeze-footer: "Ocean Freeze Plugin"
  freeze-footer-icon: ""

  # ═══ Admit Notification ═══
  admit-embed-title: "\u26a0\ufe0f Player Admitted to Hacking"
  admit-embed-description: "**{player}** has admitted to hacking (frozen by **{staff}**)"
  admit-embed-color: 15158332  # Red (decimal color)

  # ═══ Scan Completed Notification ═══
  scan-embed-title: "📊 Scan Completed - {result}"
  scan-embed-description: "Screenshare scan for **{player}** has been completed."

  # Colors for different results (decimal format)
  scan-embed-color-cheating: 15158332   # Red
  scan-embed-color-suspicious: 16776960 # Yellow
  scan-embed-color-legit: 3066993       # Green

  # Scan result fields (all customizable!)
  scan-field-player-name: "👤 Player"
  scan-field-player-value: "{player}"
  scan-field-player-inline: true

  scan-field-result-name: "📋 Result"
  scan-field-result-value: "{result}"
  scan-field-result-inline: true

  scan-field-detections-name: "🔴 Detections"
  scan-field-detections-value: "{detections}"
  scan-field-detections-inline: true

  scan-field-warnings-name: "🟡 Warnings"
  scan-field-warnings-value: "{warnings}"
  scan-field-warnings-inline: true

  scan-field-suspicious-name: "🟠 Suspicious"
  scan-field-suspicious-value: "{suspicious}"
  scan-field-suspicious-inline: true

  scan-field-vpn-name: "🌐 VPN"
  scan-field-vpn-value: "{vpn}"
  scan-field-vpn-inline: true

  scan-field-country-name: "🌍 Country"
  scan-field-country-value: "{country}"
  scan-field-country-inline: true

  scan-field-scan-time-name: "⏱️ Scan Time"
  scan-field-scan-time-value: "{scantime}"
  scan-field-scan-time-inline: true

  scan-field-url-name: "🔗 View Full Results"
  scan-field-url-value: "[Click here]({scanurl})"

  scan-footer: "Ocean Freeze Plugin"
  scan-footer-icon: ""
